<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheelsys — Connexion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4f6f9;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff; border-radius: 12px; padding: 40px 36px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12); width: 100%; max-width: 380px;
    }
    .logo {
      text-align: center; margin-bottom: 28px;
      font-size: 22px; font-weight: 800; color: #1a2e4a;
    }
    .logo span { font-size: 32px; display: block; margin-bottom: 6px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
    input {
      width: 100%; height: 42px; padding: 0 14px;
      border: 1.5px solid #e0e4ea; border-radius: 8px;
      font-size: 14px; color: #1a2236; outline: none;
      transition: border-color .15s; margin-bottom: 16px;
    }
    input:focus { border-color: #1a2e4a; }
    .btn {
      width: 100%; height: 44px; background: #1a2e4a; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .btn:hover { background: #223558; }
    .btn:disabled { opacity: .5; cursor: default; }
    .error {
      background: #ffebee; color: #e53935; border-radius: 6px;
      padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span>🚗</span>
      Contrôle Équipes
    </div>
    <p style="text-align:center;font-size:12px;color:#6b7280;margin-bottom:20px">Connectez-vous avec vos identifiants Wheelsys</p>
    <div class="error" id="err"></div>
    <form id="form" onsubmit="login(event)">
      <label for="username">Email Wheelsys</label>
      <input type="email" id="username" autocomplete="username" required placeholder="votre@email.com">
      <label for="password">Mot de passe Wheelsys</label>
      <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
      <button type="submit" class="btn" id="btn">Se connecter</button>
    </form>
  </div>
  <script>
    async function login(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Connexion…';

      try {
        const resp = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
          credentials: 'include',
        });
        const json = await resp.json();
        if (!resp.ok) throw new Error(json.error || 'Erreur');
        window.location.href = '/';
      } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Se connecter';
      }
    }
  </script>
</body>
</html>
